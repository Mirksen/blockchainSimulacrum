# proofofwork.fyi leaderboard server (lab zone). See ../README.md for the zone rules.
# Host layout (/opt/lab/proofofwork/): compose.yaml, .env (0600), server/ (copy of the repo's
# server/), static/ (optional web/dist), data/ (owned by uid 1000). No image is built anywhere:
# the official Node image runs the read-only source. Moving the stack = copying this directory.
# In the tunnel configuration, route the public hostname to http://app:8080.
name: lab-proofofwork

services:
  app:
    image: node:24.19.0-alpine
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /app
    command: ["node", "src/main.js"]
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "8080"
      DB_PATH: /data/leaderboard.sqlite
      STATIC_DIR: /static
      # The app never needs the tunnel credential; blank it even though it is in the shared .env.
      TUNNEL_TOKEN: ""
    volumes:
      - ./server:/app:ro
      - ./static:/static:ro
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
    networks:
      - lab

  tunnel:
    image: cloudflare/cloudflared:2026.10.4
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN must be set in .env}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      app:
        condition: service_healthy
    networks:
      - lab

networks:
  lab:
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.28.1.0/24

