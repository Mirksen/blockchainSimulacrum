name: Server checks
on:
  push:
    branches: [master]
    paths: ['server/**', 'shared/**', 'web/**', 'deploy/lab/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', 'shared/**', 'web/**', 'deploy/lab/**', '.github/workflows/server.yml']
permissions:
  contents: read
jobs:
  server:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      # Same credential-free public checkout as production.yml: the historical
      # app gitlink has no .gitmodules and breaks checkout's auth cleanup.
      - name: Fetch exact public source without credentials
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/Mirksen/blockchainSimulacrum.git
          git fetch --depth=1 origin "$SOURCE_REVISION"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
      - name: Prepare complete image accounting in this fresh hosted job
        run: |
          # This job owns its ephemeral daemon; never reconfigure a shared pool host.
          sudo python3 - <<'PYCODE'
          import json
          from pathlib import Path
          path = Path("/etc/docker/daemon.json")
          config = json.loads(path.read_text()) if path.exists() else {}
          config.setdefault("features", {})["containerd-snapshotter"] = True
          path.write_text(json.dumps(config))
          PYCODE
          sudo systemctl restart docker
          docker version --format '{{.Server.Version}}'
          docker info --format '{{json .DriverStatus}}'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check server, web and release declaration
        run: |
          npm --prefix server test
          npm --prefix web ci
          npm --prefix web run check
          python3 -m unittest discover -s deploy/lab/proofofwork/test -p test_release.py -v
      - name: Build and accept the complete immutable ARM64 runtime
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          docker build --build-arg SOURCE_REVISION="$SOURCE_REVISION" -t proofofwork-lab:checked -f deploy/lab/proofofwork/Dockerfile .
          test "$(docker image inspect --format '{{.Architecture}}' proofofwork-lab:checked)" = arm64
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' proofofwork-lab:checked)" = "$SOURCE_REVISION"
          python3 - <<'PYCODE'
          import sys
          sys.path.insert(0, "deploy/lab/proofofwork")
          from lab_image import inspect_image, storage_bytes
          size = storage_bytes(inspect_image("proofofwork-lab:checked"))
          assert 0 < size <= 384 * 1024**2
          print(f"complete ARM64 image allocation: {size} bytes")
          PYCODE
          bash deploy/lab/proofofwork/test/image-check.sh proofofwork-lab:checked
          mkdir -p checked-image
          docker save proofofwork-lab:checked > checked-image/image.tar
          docker image inspect --format '{{.Id}}' proofofwork-lab:checked > checked-image/image.id
          (cd checked-image && sha256sum image.tar image.id > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lab-checked-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: checked-image/
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: server
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      # Same credential-free public checkout as production.yml: the historical
      # app gitlink has no .gitmodules and breaks checkout's auth cleanup.
      - name: Fetch exact public source without credentials
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/Mirksen/blockchainSimulacrum.git
          git fetch --depth=1 origin "$SOURCE_REVISION"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
      - name: Correct the hosted Docker multi-manifest push defect
        run: |
          # Docker28.0.4 tags child manifests separately (moby/moby#49949).
          # Upgrade only this fresh publisher; retain the exact checked archive,
          # index and attestations. Skip once hosted Docker already has the fix.
          if dpkg --compare-versions "$(docker version --format '{{.Server.Version}}')" lt 28.2.2; then
            sudo apt-get update
            sudo apt-get install --yes \
              moby-engine=28.2.2-ubuntu24.04u1 \
              moby-cli=28.2.2-ubuntu24.04u1
          fi
          dpkg --compare-versions "$(docker version --format '{{.Server.Version}}')" ge 28.2.2
      - name: Prepare complete image accounting in this fresh hosted job
        run: |
          # This job owns its ephemeral daemon; never reconfigure a shared pool host.
          sudo python3 - <<'PYCODE'
          import json
          from pathlib import Path
          path = Path("/etc/docker/daemon.json")
          config = json.loads(path.read_text()) if path.exists() else {}
          config.setdefault("features", {})["containerd-snapshotter"] = True
          path.write_text(json.dumps(config))
          PYCODE
          sudo systemctl restart docker
          docker version --format '{{.Server.Version}}'
          docker info --format '{{json .DriverStatus}}'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: lab-checked-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: checked-image/
      - name: Publish only the already accepted image and release declaration
        env:
          SOURCE_REVISION: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          REGISTRY_ACTOR: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd checked-image && sha256sum -c SHA256SUMS)
          docker load -i checked-image/image.tar
          test "$(docker image inspect --format '{{.Id}}' proofofwork-lab:checked)" = "$(cat checked-image/image.id)"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_ACTOR" --password-stdin
          docker tag proofofwork-lab:checked "ghcr.io/mirksen/proofofwork-lab:$SOURCE_REVISION"
          docker push "ghcr.io/mirksen/proofofwork-lab:$SOURCE_REVISION"
          docker logout ghcr.io
          # The registry must return the same tested image/index anonymously.
          # This rejects a tag accidentally left pointing at an attestation.
          anonymous_config="$(mktemp -d)"
          DOCKER_CONFIG="$anonymous_config" docker pull --platform linux/arm64 "ghcr.io/mirksen/proofofwork-lab:$SOURCE_REVISION"
          test "$(docker image inspect --format '{{.Id}}' "ghcr.io/mirksen/proofofwork-lab:$SOURCE_REVISION")" = "$(cat checked-image/image.id)"
          rm -r "$anonymous_config"
          docker pull --platform linux/arm64 cloudflare/cloudflared@sha256:c6c7ae1d5dfdcb094ad344ed68ccffc26635c9c6be80965664c33baf064b0515
          mkdir -p lab-release
          python3 deploy/lab/proofofwork/make-release.py --revision "$SOURCE_REVISION" --run-id "$RELEASE_RUN_ID" --output lab-release/release.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lab-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: lab-release/release.json
          retention-days: 30
          if-no-files-found: error
