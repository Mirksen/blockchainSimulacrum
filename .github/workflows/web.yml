name: Web checks
on:
  push:
    branches: [master]
    paths: ['web/**', 'shared/**', '.github/workflows/web.yml', '.github/workflows/production.yml']
  pull_request:
    paths: ['web/**', 'shared/**', '.github/workflows/web.yml', '.github/workflows/production.yml']
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: google-chrome --version
      - run: npm run test:browser
        env:
          VITE_POSTHOG_PROJECT_TOKEN: phc_syntheticproject
          EXPECT_POSTHOG: '1'
      - run: npm run deploy:check
        env:
          WRANGLER_LOG_PATH: /tmp/proofofwork-wrangler.log
